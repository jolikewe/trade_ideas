<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>The Vault</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --edge: #263044;
    --text: #e6ebf5;
    --muted: #8a96ad;
    --accent: #4fd1c5;
    --danger: #ff5470;
    --gold: #f6c453;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    overflow: hidden;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 20px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    transition: opacity .4s, transform .4s;
  }
  .card.hidden { opacity: 0; transform: scale(.92); pointer-events: none; }
  .card.shake { animation: shake .45s; }

  .lock {
    width: 64px; height: 64px; margin: 0 auto 18px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(79,209,197,.1);
    border: 1px solid rgba(79,209,197,.35);
  }
  .lock svg { width: 30px; height: 30px; stroke: var(--accent); }

  .label {
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(34px, 10vw, 44px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-bottom: 24px;
  }

  input {
    width: 100%;
    font: inherit;
    font-size: 24px;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--edge);
    background: #0d1220;
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,209,197,.2); }
  input.bad { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,84,112,.2); }

  button {
    width: 100%;
    margin-top: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .05em;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #062a27;
    cursor: pointer;
    transition: transform .1s, filter .2s;
    touch-action: manipulation;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.98); }

  .msg {
    min-height: 24px;
    margin-top: 16px;
    font-weight: 700;
    letter-spacing: .15em;
    color: var(--danger);
    opacity: 0;
    transition: opacity .2s;
  }
  .msg.show { opacity: 1; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ---------- Unlocked screen ---------- */
  .vault {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .5s;
  }
  .vault.show { opacity: 1; pointer-events: auto; }

  .door {
    position: relative;
    width: min(62vw, 240px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #2a3550 0%, #151c2c 70%);
    border: 6px solid #3a4763;
    box-shadow: 0 0 0 10px #1a2133, 0 0 60px rgba(246,196,83,0);
  }
  .vault.show .door { animation: glow 1.2s 1.6s forwards; }
  .wheel {
    position: absolute; inset: 18%;
    border-radius: 50%;
    border: 4px solid var(--gold);
  }
  .wheel::before, .wheel::after {
    content: ""; position: absolute;
    left: 50%; top: -8%;
    width: 6px; height: 116%;
    margin-left: -3px;
    background: var(--gold);
    border-radius: 3px;
  }
  .wheel::after { transform: rotate(90deg); }
  .hub {
    position: absolute; inset: 40%;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 4px #151c2c;
  }
  .vault.show .wheel { animation: spin 1.4s cubic-bezier(.5,0,.2,1) .2s forwards; }

  .title {
    font-size: clamp(30px, 9vw, 52px);
    font-weight: 800;
    letter-spacing: .12em;
    text-align: center;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(246,196,83,.5);
    opacity: 0; transform: translateY(16px) scale(.95);
  }
  .vault.show .title { animation: rise .7s 1.6s forwards; }

  .sub {
    color: var(--muted); font-size: 15px;
    opacity: 0;
  }
  .vault.show .sub { animation: rise .6s 2s forwards; }

  .again {
    width: auto; padding: 12px 28px; margin: 0;
    background: transparent; color: var(--text);
    border: 1px solid var(--edge);
    opacity: 0;
  }
  .vault.show .again { animation: rise .6s 2.3s forwards; }

  .spark {
    position: fixed; width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none;
    animation: burst 1.6s ease-out forwards;
  }

  @keyframes spin { to { transform: rotate(540deg); } }
  @keyframes glow { to { box-shadow: 0 0 0 10px #1a2133, 0 0 80px rgba(246,196,83,.45); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes burst {
    0% { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <div class="lock" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
  </div>
  <p class="label">Enter the code to open the vault</p>
  <h1>17 + 25 = ?</h1>
  <form id="form" autocomplete="off">
    <input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="?" aria-label="Your answer" maxlength="6" required>
    <button type="submit">UNLOCK</button>
  </form>
  <p class="msg" id="msg" role="alert">ACCESS DENIED</p>
</main>

<section class="vault" id="vault" aria-live="polite">
  <div class="door" aria-hidden="true">
    <div class="wheel"><div class="hub"></div></div>
  </div>
  <div class="title">VAULT UNLOCKED</div>
  <p class="sub">Correct. Nicely done.</p>
  <button class="again" id="again" type="button">Lock again</button>
</section>

<script>
(function () {
  // SHA-256 of the correct answer. The answer itself is not stored in this file.
  var TARGET = "73475cb40a568e8da8a045ced110137e159f890ac4da883b6b17dc651b3a8049";

  // Fallback SHA-256 for non-secure contexts where crypto.subtle is unavailable.
  function sha256Fallback(str) {
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes = Array.from(new TextEncoder().encode(str));
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (var s = 56; s >= 0; s -= 8) bytes.push(s >= 32 ? 0 : (bitLen >>> s) & 0xff);
    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
    var W = new Array(64);
    for (var i = 0; i < bytes.length; i += 64) {
      for (var t = 0; t < 16; t++) {
        W[t] = (bytes[i+t*4] << 24) | (bytes[i+t*4+1] << 16) | (bytes[i+t*4+2] << 8) | bytes[i+t*4+3];
      }
      for (t = 16; t < 64; t++) {
        var s0 = rotr(W[t-15],7) ^ rotr(W[t-15],18) ^ (W[t-15] >>> 3);
        var s1 = rotr(W[t-2],17) ^ rotr(W[t-2],19) ^ (W[t-2] >>> 10);
        W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (t = 0; t < 64; t++) {
        var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[t] + W[t]) | 0;
        var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        var mj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + mj) | 0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }
    return H.map(function (v) { return (v >>> 0).toString(16).padStart(8, "0"); }).join("");
  }

  async function sha256(str) {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    }
    return sha256Fallback(str);
  }

  var form = document.getElementById("form");
  var input = document.getElementById("answer");
  var msg = document.getElementById("msg");
  var card = document.getElementById("card");
  var vault = document.getElementById("vault");
  var again = document.getElementById("again");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var value = input.value.trim().replace(/^0+(?=\d)/, "");
    if (!value) return;
    var hash = await sha256(value);

    if (hash === TARGET) {
      msg.classList.remove("show");
      input.classList.remove("bad");
      input.blur();
      card.classList.add("hidden");
      vault.classList.add("show");
      setTimeout(confetti, 1600);
    } else {
      msg.classList.add("show");
      input.classList.add("bad");
      card.classList.remove("shake");
      void card.offsetWidth; // restart animation
      card.classList.add("shake");
      if (navigator.vibrate) navigator.vibrate(120);
      input.select();
    }
  });

  input.addEventListener("input", function () {
    input.value = input.value.replace(/[^0-9\-]/g, "");
    msg.classList.remove("show");
    input.classList.remove("bad");
  });

  again.addEventListener("click", function () {
    vault.classList.remove("show");
    card.classList.remove("hidden");
    input.value = "";
    setTimeout(function () { input.focus(); }, 300);
  });

  function confetti() {
    var colors = ["#f6c453", "#4fd1c5", "#ffffff", "#ff8fa3"];
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2 - 60;
    for (var i = 0; i < 40; i++) {
      var p = document.createElement("span");
      p.className = "spark";
      var angle = Math.random() * Math.PI * 2;
      var dist = 120 + Math.random() * 220;
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
      document.body.appendChild(p);
      setTimeout((function (el) { return function () { el.remove(); }; })(p), 1700);
    }
  }
})();
</script>
</body>
</html>
